name: worker tests
on:
  push:
  pull_request:
  schedule:
    - cron: '0 13 * * *'   # daily 7 AM MT: catches the calendar running out
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: node --test 'worker/test/*.test.mjs'
