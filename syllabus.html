<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Syllabus — Learn, Vibe, Build · ATLS 4519 · Fall 2026</title>
<style>
  :root {
    --ink: #1a1a1a;
    --muted: #666;
    --accent: #2456a4;
    --bg: #fdfcf9;
    --border: #e4e1da;
  }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.65;
  }
  main { max-width: 760px; margin: 0 auto; padding: 2.5rem 1.25rem 4rem; }
  .back { font-size: 0.9rem; margin-bottom: 1.5rem; }
  .back a { color: var(--muted); text-decoration: none; }
  .back a:hover { color: var(--accent); }
  #content h1 { font-size: 2rem; letter-spacing: -0.02em; }
  #content h2 { font-size: 1.35rem; margin-top: 2.2rem; border-bottom: 1px solid var(--border); padding-bottom: 0.3rem; }
  #content h3 { font-size: 1.1rem; margin-top: 1.6rem; }
  #content a { color: var(--accent); }
  #content table { border-collapse: collapse; width: 100%; margin: 1rem 0; font-size: 0.95rem; }
  #content th, #content td { border: 1px solid var(--border); padding: 0.45rem 0.6rem; text-align: left; }
  #content th { background: #f4f2ec; }
  #content blockquote { border-left: 3px solid var(--border); margin: 1rem 0; padding: 0.2rem 1rem; color: var(--muted); }
  #content code { background: #f1efe9; padding: 0.1em 0.35em; border-radius: 4px; font-size: 0.9em; }
</style>
</head>
<body>
<main>
  <p class="back"><a href="./">&larr; Learn, Vibe, Build</a></p>
  <div id="content">
    <noscript>
      <p>This page renders the course syllabus. With JavaScript off, read it directly:
      <a href="SYLLABUS_DRAFT.md">SYLLABUS_DRAFT.md</a></p>
    </noscript>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script>
  fetch('SYLLABUS_DRAFT.md')
    .then(function (r) { return r.text(); })
    .then(function (md) {
      document.getElementById('content').innerHTML = marked.parse(md);
      document.title = 'Syllabus — Learn, Vibe, Build · ATLS 4519 · Fall 2026';
    })
    .catch(function () {
      document.getElementById('content').innerHTML =
        '<p>Could not load the syllabus. <a href="SYLLABUS_DRAFT.md">Read it as markdown instead.</a></p>';
    });
</script>
</body>
</html>
