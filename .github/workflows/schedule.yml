name: schedule
# Moves the site to the new week with no human edit. Runs a little after
# midnight Denver time every day (06:05 UTC is 00:05 MDT, 07:05 UTC is
# 00:05 MST), renders the pages from schedule/semester.json, and commits if
# anything changed. On Mondays that is the new current week. GitHub Pages then
# redeploys. It also runs on pushes to main, so a semester.json edit merged
# without running the generator still reaches the site.
on:
  schedule:
    - cron: '5 6,7 * * *'
  push:
    branches: [main]
    paths: ['schedule/semester.json', 'tools/build_schedule.py', 'index.html', 'schedule/index.html']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: schedule
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render, commit and redeploy if the week changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Pushes made with the workflow token may not start a Pages build, and a
          # failed request must not strand the site: every run asks for a build
          # when the latest one isn't for main's newest commit.
          ensure_pages() {
            for try in 1 2 3; do
              built=$(gh api "repos/$GITHUB_REPOSITORY/pages/builds/latest" --jq .commit || true)
              if [ "$built" = "$(git rev-parse HEAD)" ]; then echo "Pages build is current."; return 0; fi
              gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds" && return 0
              sleep 10
            done
            echo "Could not request a Pages build." >&2; return 1
          }
          # Render from the newest main; if another commit lands first, start over.
          for attempt in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main
            python3 tools/build_schedule.py
            if git diff --quiet; then echo "Pages already match today's week."; ensure_pages; exit $?; fi
            git commit -qam "Schedule: current week as of $(TZ=America/Denver date +%F) (tools/build_schedule.py)"
            if git push origin HEAD:main; then ensure_pages; exit $?; fi
            sleep 5
          done
          echo "Could not push the schedule update after 3 tries." >&2; exit 1
