name = "lvb-accounts"
main = "src/index.js"
compatibility_date = "2026-08-01"
workers_dev = false

routes = [
  { pattern = "api.learnvibe.build", custom_domain = true }
]

# Workers Logs: keep console output (one line per sign-in email attempt, see
# handleAuthRequest) so a failed send can be looked up after the fact.
# Invocation logs stay off: they record the request URL, and a sign-in link's
# token is in the /auth/callback query string.
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
invocation_logs = false

[vars]
SITE_ORIGIN = "https://cu.learnvibe.build"
API_ORIGIN = "https://api.learnvibe.build"
EMAIL_FROM = "Learn Vibe Build <hello@learnvibe.build>"
# Final demo sign-up: these throwaway test accounts see and use /demos while the
# sign-up is still closed to students (demo_settings.signup_open = 0), so the
# flow can be checked in production without reaching anyone. Comma-separated.
DEMO_PREVIEW = "e2e-test@learnvibe.build,e2e-test2@learnvibe.build"

[[d1_databases]]
binding = "DB"
database_name = "lvb-accounts"
database_id = "80abf459-bac5-437c-820b-b9c38fac2c0b"

# Cloudflare Email Service — same binding + already-onboarded sending domain
# (learnvibe.build, DKIM/SPF/DMARC set up) as the main learnvibe.build worker.
# Replaces AgentMail: recipients' mail providers were flagging the AgentMail
# send as unauthenticated/mismatched, since it went out as uni@agi.unforced.org
# while the message claimed to be Learn Vibe Build.
[[send_email]]
name = "EMAIL"

# Class-only media (the class film). Served by /media/<key> to signed-in students only.
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "lvb-class-media"

# What students uploaded to Canvas, rendered for the instructor (page images,
# HTML, images, video), written by worker/resync.py --files. Private: served
# only by /instructor/file/<id>/<part> to an instructor session.
[[r2_buckets]]
binding = "FILES"
bucket_name = "lvb-instructor-files"

# One-minute gift videos, one per student, at gift/<student_id>.mp4, written by
# tools/publish_gift_videos.py. Private: served only by /gift/<id> to that
# student's own session or an instructor.
[[r2_buckets]]
binding = "GIFTS"
bucket_name = "lvb-gift-videos"
